# Sharded ingest topology: 1 coordinator + 15 workers behind one URL.
#
#   docker compose -f docker-compose.shard.yml up -d
#
# Each worker is byte-identical to the existing rag-for-2tb image — only the
# coordinator runs new code (app.coordinator.main). The coordinator listens
# on the host's port 8889; workers stay on an internal network.
#
# Each worker has its OWN SQLite + storage volume under ./shard-data/<i>/
# so they cannot contend on writes. All workers share one Azure AI Search
# index via the AZURE_SEARCH_* env vars in .env.
#
# In production, run each worker on its own host (8 vCPU / 8 GB RAM /
# 200 GB SSD). This file is the single-machine reference / dev topology;
# translate to Azure Container Apps Jobs (or 15 VMs running this image) for
# the real 2TB ingest.

x-image: &image
  image: ${ACR_REGISTRY:-acraianalytic.azurecr.io}/rag-for-2tb:${IMAGE_TAG:-latest}
  build:
    context: .
    dockerfile: Dockerfile

x-worker-base: &worker-base
  <<: *image
  env_file:
    - path: .env
      required: false
    - path: .env.dev
      required: false
  restart: unless-stopped

services:
  coordinator:
    <<: *image
    container_name: rag-coordinator
    environment:
      WORKER_MODE: coordinator
      SHARD_TOTAL: "15"
      WORKER_HOST_TEMPLATE: "http://worker-{i}:8889"
      COORDINATOR_TIMEOUT: "600"
    ports:
      - "8889:8889"
    depends_on:
      - worker-0
      - worker-1
      - worker-2
      - worker-3
      - worker-4
      - worker-5
      - worker-6
      - worker-7
      - worker-8
      - worker-9
      - worker-10
      - worker-11
      - worker-12
      - worker-13
      - worker-14
    restart: unless-stopped

  worker-0:
    <<: *worker-base
    container_name: rag-worker-0
    volumes:
      - ./shard-data/0/storage:/srv/storage
      - ./shard-data/0/db:/srv/db

  worker-1:
    <<: *worker-base
    container_name: rag-worker-1
    volumes:
      - ./shard-data/1/storage:/srv/storage
      - ./shard-data/1/db:/srv/db

